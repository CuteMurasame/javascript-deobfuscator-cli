name: Build Linux Executable

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript
        run: npm run build

      - name: Build Linux executable
        run: npx pkg dist/cli.js --targets node18-linux-x64 --output build/js-deobfuscator-linux

      - name: Make executable
        run: chmod +x build/js-deobfuscator-linux

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: js-deobfuscator-linux
          path: build/js-deobfuscator-linux

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: js-deobfuscator-linux

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: js-deobfuscator-linux
          generate_release_notes: true
